[package]
name = "splend-theme-builder"
version = "3.0.0"
description = "SplendThemeBuilder — Doom Control Center"
authors = ["Splend"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.3", features = [] }
